<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Courier New', monospace;
    }

    body {
        background: black;
        color: #6fd3ff;
        overflow: hidden;
    }

    /* Center Content */
    .container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 2;
    }

    h1 {
        font-size: 3rem;
        letter-spacing: 4px;
        text-shadow: 0 0 15px rgba(111, 211, 255, 0.8);
    }

    p {
        margin-top: 12px;
        font-size: 1.2rem;
        opacity: 0.75;
    }

    /* Subtle Stars */
    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background: transparent;
        z-index: 0;
    }

    .stars::after {
        content: "";
        position: absolute;
        width: 2px;
        height: 2px;
        background: #ffffff;
        box-shadow:
            100px 150px #fff,
            300px 200px #fff,
            500px 400px #fff,
            800px 100px #fff,
            1100px 300px #fff,
            1400px 500px #fff,
            200px 600px #fff,
            900px 700px #fff;
        opacity: 0.2;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }
</style>
</head>

<body>

<div class="stars"></div>
<canvas id="bg"></canvas>

<div class="container">
    <h1>COMING SOON</h1>
    <p>Something UNIQUE is coming your way.</p>
</div>

<script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const symbols = "01";
    const particles = [];

    for (let i = 0; i < 80; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            speed: Math.random() * 0.3 + 0.1,
            opacity: Math.random() * 0.3,
            char: symbols[Math.floor(Math.random() * symbols.length)]
        });
    }

    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#6fd3ff";
        ctx.font = "14px monospace";

        particles.forEach(p => {
            ctx.globalAlpha = p.opacity;
            ctx.fillText(p.char, p.x, p.y);

            p.y += p.speed;

            if (p.y > canvas.height) {
                p.y = 0;
                p.x = Math.random() * canvas.width;
            }
        });

        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
    }

    draw();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
